
events {}

http {
    # Log which gateway handles each request
    log_format upstream_log
        '$remote_addr [$time_local] "$request" '
        'status=$status upstream=$upstream_addr';

    access_log /var/log/nginx/access.log upstream_log;

    # Round-robin load balancing between two gateways
    upstream storage_gateways {
        server gateway:8000;
        server gateway2:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://storage_gateways;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Gateway failure handling
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            proxy_next_upstream error timeout;
        }
    }
}