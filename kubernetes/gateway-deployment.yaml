apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: distributed-systems-midterm-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: STORAGE_MODE
              value: "kubernetes"
            - name: API_KEY
              value: "midterm-secret"
            - name: DATABASE_URL
              value: "postgresql://storage:storagepass@host.docker.internal:5433/storage"