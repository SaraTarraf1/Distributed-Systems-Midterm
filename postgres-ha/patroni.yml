scope: storage-ha
namespace: /service/
name: PLACEHOLDER

restapi:
  listen: 0.0.0.0:8008
  connect_address: PLACEHOLDER:8008

etcd3:
  hosts:
    - etcd1:2379
    - etcd2:2379
    - etcd3:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      parameters:
        wal_level: replica
        max_wal_senders: 10
        max_replication_slots: 10
        hot_standby: "on"
  initdb:
    - encoding: UTF8
    - data-checksums
  pg_hba:
    - host replication replicator 0.0.0.0/0 md5
    - host all all 0.0.0.0/0 md5
  users:
    storage:
      password: storagepass
      options:
        - createdb

postgresql:
  listen: 0.0.0.0:5432
  connect_address: PLACEHOLDER:5432
  data_dir: /var/lib/postgresql/data
  bin_dir: /usr/lib/postgresql/16/bin
  authentication:
    replication:
      username: replicator
      password: replicatorpass
    superuser:
      username: postgres
      password: postgrespass
  parameters:
    unix_socket_directories: /var/run/postgresql