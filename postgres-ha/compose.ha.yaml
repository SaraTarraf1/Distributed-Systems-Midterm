services:
  etcd1:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - /usr/local/bin/etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=storage-etcd-cluster
    volumes:
      - etcd1_data:/etcd-data

  etcd2:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - /usr/local/bin/etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=storage-etcd-cluster
    volumes:
      - etcd2_data:/etcd-data

  etcd3:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - /usr/local/bin/etcd
      - --name=etcd3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=storage-etcd-cluster
    volumes:
      - etcd3_data:/etcd-data

  pg1:
    image: storage-postgres-ha:latest
    command: /etc/patroni/pg1.yml
    user: postgres
    volumes:
      - ./pg1.yml:/etc/patroni/pg1.yml:ro
      - pg1_data:/var/lib/postgresql/data
    depends_on:
      - etcd1
      - etcd2
      - etcd3

  pg2:
    image: storage-postgres-ha:latest
    command: /etc/patroni/pg2.yml
    user: postgres
    volumes:
      - ./pg2.yml:/etc/patroni/pg2.yml:ro
      - pg2_data:/var/lib/postgresql/data
    depends_on:
      - etcd1
      - etcd2
      - etcd3

  pg3:
    image: storage-postgres-ha:latest
    command: /etc/patroni/pg3.yml
    user: postgres
    volumes:
      - ./pg3.yml:/etc/patroni/pg3.yml:ro
      - pg3_data:/var/lib/postgresql/data
    depends_on:
      - etcd1
      - etcd2
      - etcd3
  haproxy:
    image: haproxy:3.0-alpine
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:5433:5432"
    depends_on:
      - pg1
      - pg2
      - pg3
    restart: unless-stopped

volumes:
  etcd1_data:
  etcd2_data:
  etcd3_data:
  pg1_data:
  pg2_data:
  pg3_data:
  haproxy_data: